<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Explorer</title>
  </head>

  <body class="bg-slate-50 text-slate-900">
    <header class="bg-slate-900 p-4 text-white">
      <h1 class="text-2xl font-bold">Product Explorer</h1>
    </header>

    <main class="mx-auto max-w-7xl p-4">
      <!-- Controls -->
      <section class="mb-4 grid gap-4 sm:grid-cols-3">
        <div>
          <label for="search" class="block text-sm font-medium">Search</label>
          <input id="search" type="search" placeholder="Search products..."
            class="mt-1 w-full rounded border border-slate-300 bg-white p-2" />
        </div>

        <div>
          <label for="category" class="block text-sm font-medium">Category</label>
          <select id="category"
            class="mt-1 w-full rounded border border-slate-300 bg-white p-2">
            <option value="all">All categories</option>
          </select>
        </div>

        <div>
          <label for="sort" class="block text-sm font-medium">Sort by</label>
          <select id="sort"
            class="mt-1 w-full rounded border border-slate-300 bg-white p-2">
            <option value="default">Default</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </div>
      </section>

      <!-- Status message, stats and cards -->
      <p id="status" aria-live="polite" class="mb-2 text-sm text-slate-600"></p>
      <div id="stats" class="mb-4 flex flex-wrap gap-4"></div>
      <div id="grid"
        class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    </main>

    <!-- Details popup -->
    <dialog id="details"
      class="m-auto w-full max-w-lg rounded-lg p-6 backdrop:bg-black/50">
      <div id="details-content"></div>
      <button id="close-details" type="button"
        class="mt-4 rounded bg-slate-900 px-4 py-2 text-white">Close</button>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
